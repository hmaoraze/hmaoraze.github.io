<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xorigimage · 获取X原始图片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0c0e;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            padding: 1.5rem;
        }

        .card {
            max-width: 540px;
            width: 100%;
            padding: 2.5rem 2rem;
            background: rgba(18, 20, 22, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
            transition: box-shadow 0.2s ease;
            color: #e8eef2;
        }

        .card:hover {
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 0.75rem;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .description {
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 350;
            color: #b0b8c0;
            margin-bottom: 2rem;
            max-width: 42ch;
        }

        .link-container {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1.8rem;
            margin-top: 0.4rem;
        }

        a {
            color: #a0a8b2;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s ease, border-color 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 2px;
        }

        a:hover {
            color: #ffffff;
            border-bottom-color: rgba(255, 255, 255, 0.7);
        }

        a::after {
            content: "↗";
            font-size: 1.1rem;
            opacity: 0.6;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        a:hover::after {
            opacity: 1;
            transform: translate(2px, -2px);
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .description {
                font-size: 1rem;
            }
            a {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>xorigimage</h1>
        <p class="description">
            在 X（原“推特”）界面右击图片，选择“在新标签页打开图片”，即可获取原始图片。
        </p>
        <div class="link-container">
            <a href="https://github.com/hmaoraze/xorigimage" target="_blank" rel="noopener">
                hmaoraze/xorigimage
            </a>
        </div>
    </div>
</body>
</html>
